<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1410"/>
      <stop offset="1" stop-color="#2d1d12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.42" r="0.45">
      <stop offset="0" stop-color="#f0a040" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f0a040" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc35a"/>
      <stop offset="1" stop-color="#e0841c"/>
    </linearGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#glow)"/>

  <!-- mug -->
  <g transform="translate(905 92)">
    <rect x="0" y="40" width="170" height="190" rx="18" fill="url(#beer)"/>
    <path d="M170 85 h28 a32 32 0 0 1 32 32 v40 a32 32 0 0 1 -32 32 h-28" fill="none" stroke="#e0841c" stroke-width="20"/>
    <circle cx="25" cy="40" r="30" fill="#fff7e8"/>
    <circle cx="70" cy="30" r="36" fill="#fff7e8"/>
    <circle cx="118" cy="34" r="32" fill="#fff7e8"/>
    <circle cx="152" cy="46" r="24" fill="#fff7e8"/>
    <rect x="0" y="40" width="170" height="22" fill="#fff7e8"/>
    <rect x="34" y="88" width="14" height="118" rx="7" fill="#fff" opacity="0.25"/>
    <rect x="78" y="88" width="14" height="118" rx="7" fill="#fff" opacity="0.18"/>
    <rect x="122" y="88" width="14" height="118" rx="7" fill="#fff" opacity="0.12"/>
  </g>

  <text x="88" y="150" class="sans" font-size="72" font-weight="800" fill="#fff4e2">Easy SillyTavern</text>
  <text x="90" y="212" class="sans" font-size="36" font-weight="600" fill="#f0b060">酒馆一键安装 · 复制一行，按下回车</text>

  <g transform="translate(90 258)">
    <rect width="620" height="56" rx="12" fill="#0e0a08" stroke="#4a3322"/>
    <text x="22" y="36" class="mono" font-size="22" fill="#8a7a6a">$</text>
    <text x="48" y="36" class="mono" font-size="22" fill="#fff4e2">bash -c "$(curl -fsSL …/easy-st.sh)"</text>
  </g>

  <text x="90" y="356" class="sans" font-size="22" fill="#b89c80">macOS 10.15+ · Windows 10 / 11 · 不用管理员密码 · 不用装 Git / Node.js</text>
</svg>
