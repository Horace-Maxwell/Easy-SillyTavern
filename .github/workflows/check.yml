name: check
on: [push, pull_request]
env:
  # README 里的命令指向 main；这里换成正在测的这次提交
  REF: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Both READMEs give exactly one install command per system, word for word
        run: |
          for pattern in '^bash -c ' '^powershell -NoProfile'; do
            zh="$(grep -E "$pattern" README.md | sort -u)"
            en="$(grep -E "$pattern" README.en.md | sort -u)"
            [ -n "$zh" ] && [ "$zh" = "$en" ] && [ "$(printf '%s\n' "$zh" | wc -l)" -eq 1 ]
          done
      - name: Windows install command has no dollar sign (it must work in Command Prompt too)
        run: "! grep -E '^powershell -NoProfile' README.md | grep -F '$'"

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Syntax (macOS bash 3.2)
        run: /bin/bash -n mac/easy-st.sh && /bin/bash -n tests/smoke.sh
      - name: ShellCheck
        run: brew install shellcheck && shellcheck -s bash -S warning -e SC2155 mac/easy-st.sh
      - name: The install command from the README
        run: |
          grep -E '^bash -c ' README.md | sed -e "s#@main/#@$REF/#" -e "s#/main/#/$REF/#" > "$RUNNER_TEMP/readme.sh"
          EST_HOME="$RUNNER_TEMP/readme" EST_YES=1 EST_NO_START=1 EST_NO_SHORTCUTS=1 /bin/bash "$RUNNER_TEMP/readme.sh"
          test -f "$RUNNER_TEMP/readme/app/server.js"
      - name: End to end
        run: /bin/bash tests/smoke.sh

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: The install command from the README
        run: |
          grep -E '^bash -c ' README.md | sed -e "s#@main/#@$REF/#" -e "s#/main/#/$REF/#" > "$RUNNER_TEMP/readme.sh"
          EST_HOME="$RUNNER_TEMP/readme" EST_YES=1 EST_NO_START=1 EST_NO_SHORTCUTS=1 bash "$RUNNER_TEMP/readme.sh"
          test -f "$RUNNER_TEMP/readme/app/server.js"
      - name: End to end
        run: bash tests/smoke.sh

  termux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: End to end (Termux container, not a real phone)
        run: docker run --rm --security-opt seccomp=unconfined -v "$PWD:/repo:ro" termux/termux-docker:x86_64 bash -lc 'bash /repo/tests/smoke.sh'

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Encoding and syntax (Windows PowerShell 5.1)
        shell: powershell
        run: |
          foreach ($f in @("$PWD\windows\easy-st.ps1", "$PWD\tests\smoke.ps1")) {
            $b = [IO.File]::ReadAllBytes($f)
            if ($b[0] -ne 0xEF -or $b[1] -ne 0xBB -or $b[2] -ne 0xBF) { throw "$f must be UTF-8 with BOM" }
            $tokens = $null; $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile($f, [ref]$tokens, [ref]$errors)
            if ($errors) { $errors | ForEach-Object { "$($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }
          }
          $bat = [IO.File]::ReadAllBytes("$PWD\windows\" + [char]0x53cc + [char]0x51fb + [char]0x5b89 + [char]0x88c5 + [char]0x9152 + [char]0x9986 + '.bat')
          if ($bat[0] -eq 0xEF) { throw 'the .bat must not have a BOM' }
      - name: PSScriptAnalyzer
        shell: powershell
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) { Install-Module PSScriptAnalyzer -Force -Scope CurrentUser }
          Invoke-ScriptAnalyzer -Path windows/easy-st.ps1 -Severity Error -EnableExit
      - name: Prepare the README command
        shell: bash
        run: grep -E '^powershell -NoProfile' README.md | sed -e "s#@main/#@$REF/#" -e "s#/main/#/$REF/#" -e 's/\r$//' > "$RUNNER_TEMP/readme.bat"
      - name: The install command from the README, in Command Prompt
        shell: cmd
        env:
          EST_YES: '1'
          EST_NO_START: '1'
          EST_NO_SHORTCUTS: '1'
        run: |
          set "EST_HOME=%RUNNER_TEMP%\readme-cmd"
          call "%RUNNER_TEMP%\readme.bat"
          if not exist "%EST_HOME%\app\server.js" exit /b 1
      - name: The install command from the README, in PowerShell
        shell: powershell
        env:
          EST_YES: '1'
          EST_NO_START: '1'
          EST_NO_SHORTCUTS: '1'
        run: |
          $env:EST_HOME = "$env:RUNNER_TEMP\readme-ps"
          Invoke-Expression (Get-Content -Raw "$env:RUNNER_TEMP\readme.bat")
          if (-not (Test-Path -LiteralPath "$env:EST_HOME\app\server.js")) { throw 'SillyTavern was not installed' }
      - name: End to end
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\smoke.ps1
          exit $LASTEXITCODE
